<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bubble Topic Evolution</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12"></script>
<style>
  body { font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; color: #1f2328; background: #fff; }
  header { padding: 16px 24px 8px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #57606a; }
  .controls { padding: 0 24px 8px; display: flex; gap: 12px; align-items: center; }
  input { font: inherit; padding: 4px 8px; border: 1px solid #d0d7de; border-radius: 6px; width: 220px; }
  #chart { overflow-x: auto; padding: 0 24px 24px; }
  .link { fill: none; stroke-opacity: .25; }
  .link:hover { stroke-opacity: .55; }
  .node rect { stroke: #fff; stroke-width: .5; }
  .node text { font-size: 10px; fill: #1f2328; pointer-events: none; }
  .dim { opacity: .12; }
  .tip { position: fixed; pointer-events: none; background: #fff; border: 1px solid #d0d7de; border-radius: 8px;
         padding: 8px 10px; max-width: 360px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; font-size: 12px; }
  .tip b { font-size: 13px; }
  .ev { display: inline-block; padding: 0 6px; border-radius: 9px; background: #eef; margin-right: 4px; font-size: 11px; }
  .axis text { font-size: 11px; fill: #57606a; }
</style>
</head>
<body>
<header>
  <h1>Topic evolution in your bubble</h1>
  <div class="sub">Columns are time windows; height = topic share (averaged over tweets, articles, papers);
    ribbons = lineage (documents that would have belonged to the earlier topic). ★ birth · ⑂ split · ⑃ merge · † end</div>
</header>
<div class="controls">
  <label>Highlight <input id="q" placeholder="e.g. agent, memory, reasoning"></label>
  <span id="count" class="sub"></span>
</div>
<div id="chart"></div>
<div class="tip" id="tip"></div>
<script>
const DATA = /*DATA*/null;
const colW = 150, height = 900, margin = {top: 30, right: 160, bottom: 10, left: 10};
const width = margin.left + margin.right + DATA.windows.length * colW;
const svg = d3.select('#chart').append('svg').attr('width', width).attr('height', height + margin.top + margin.bottom);
const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

const nodes = DATA.nodes.map((n, i) => ({...n, index: i, fixedValue: n.share}));
const links = DATA.links.map(l => ({...l}));
const sankey = d3.sankey()
  .nodeId(d => d.index)
  .nodeAlign(n => n.wi)
  .nodeWidth(10).nodePadding(4)
  .extent([[0, 0], [width - margin.left - margin.right, height]])
  .iterations(32);
const graph = sankey({nodes, links});

const key = n => (n.name.split(' · ')[0] || n.name);
const color = d3.scaleOrdinal(d3.schemeTableau10.concat(d3.schemeSet3));

g.append('g').attr('class', 'axis').selectAll('text').data(DATA.windows).join('text')
  .attr('x', (d, i) => i * ((width - margin.left - margin.right - 10) / Math.max(1, DATA.windows.length - 1)))
  .attr('y', -12).text(d => d);

const link = g.append('g').selectAll('path').data(graph.links).join('path')
  .attr('class', 'link').attr('d', d3.sankeyLinkHorizontal())
  .attr('stroke', d => color(key(d.source))).attr('stroke-width', d => Math.max(1, d.width));

const node = g.append('g').selectAll('g').data(graph.nodes).join('g').attr('class', 'node');
node.append('rect').attr('x', d => d.x0).attr('y', d => d.y0)
  .attr('height', d => Math.max(1, d.y1 - d.y0)).attr('width', d => d.x1 - d.x0)
  .attr('fill', d => color(key(d)));
const mark = d => (d.events.includes('birth') ? '★' : '') + (d.events.includes('split') ? '⑂' : '') +
                  (d.events.includes('merge') ? '⑃' : '') + (d.events.includes('death') ? '†' : '');
node.append('text').attr('x', d => d.x1 + 3).attr('y', d => (d.y0 + d.y1) / 2).attr('dy', '0.35em')
  .text(d => (d.y1 - d.y0) > 9 ? `${mark(d)} ${d.name}`.slice(0, 42) : '');

const tip = d3.select('#tip');
node.on('mousemove', (e, d) => {
  tip.style('display', 'block').style('left', (e.clientX + 14) + 'px').style('top', (e.clientY + 10) + 'px')
    .html(`<b>${d.name}</b><br>${d.window} · share ${(d.share * 100).toFixed(1)}% · ${d.size} docs<br>` +
          d.events.map(x => `<span class="ev">${x}</span>`).join('') +
          `<br>tweets ${d.channels.tweet || 0} · articles ${d.channels.article || 0} · papers ${d.channels.paper || 0}` +
          `<hr>${d.examples.map(x => '• ' + x.replace(/</g, '&lt;')).join('<br>')}`);
}).on('mouseleave', () => tip.style('display', 'none'));

d3.select('#q').on('input', function () {
  const q = this.value.trim().toLowerCase();
  const hit = d => q && d.name.toLowerCase().includes(q);
  node.classed('dim', d => q && !hit(d));
  link.classed('dim', d => q && !(hit(d.source) || hit(d.target)));
  d3.select('#count').text(q ? `${graph.nodes.filter(hit).length} topics match` : '');
});
</script>
</body>
</html>
