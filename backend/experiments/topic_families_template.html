<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bubble Topic Families</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
  :root { --fg:#1f2328; --muted:#57606a; --line:#d0d7de; --bg:#fff; }
  body { font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; color: var(--fg); background: var(--bg); }
  header, section { padding: 12px 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .layer { cursor: pointer; stroke: #fff; stroke-width: .3; }
  .layer:hover { opacity: .85; }
  .axis text { fill: var(--muted); font-size: 11px; } .axis path, .axis line { stroke: var(--line); }
  .row-label { font-size: 11px; fill: var(--fg); }
  .badge { font-size: 10px; fill: var(--muted); }
  .tip { position: fixed; pointer-events: none; background: #fff; border: 1px solid var(--line); border-radius: 8px;
         padding: 8px 10px; max-width: 380px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; font-size: 12px; }
  .connector { stroke: #8c959f; stroke-width: 1; fill: none; stroke-dasharray: 2 2; }
  #fam-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #fam-list button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 2px 10px; cursor: pointer; }
  #fam-list button.on { background: var(--fg); color: #fff; border-color: var(--fg); }
</style>
</head>
<body>
<header>
  <h1>Topic families in your bubble</h1>
  <div class="muted">Height = share of the month (averaged over tweets, articles, papers). Click a stream or a name to see how the family branched.</div>
  <div id="fam-list"></div>
</header>
<section><svg id="stream"></svg></section>
<section>
  <h2 id="fam-title">Select a family</h2>
  <div class="muted" id="fam-sub">Rows = micro-topics in birth order; dashed line = branched off its closest earlier relative.</div>
  <svg id="tree"></svg>
</section>
<div class="tip" id="tip"></div>
<script>
const DATA = /*DATA*/null;
const months = DATA.months, fams = DATA.families.slice(0, 16);
const W = Math.max(900, window.innerWidth - 48), H = 380, M = {t: 10, r: 20, b: 24, l: 10};
const color = d3.scaleOrdinal(d3.schemeTableau10.concat(d3.schemeSet2, d3.schemePastel1));
const x = d3.scalePoint().domain(months).range([M.l + 200, W - M.r]);
const tip = d3.select('#tip');
const showTip = (e, html) => tip.style('display', 'block').style('left', (e.clientX + 14) + 'px').style('top', (e.clientY + 10) + 'px').html(html);
const hideTip = () => tip.style('display', 'none');

// ---- streamgraph of families ----
const rows = months.map((m, i) => Object.fromEntries([['m', m], ...fams.map(f => [f.id, f.series[i]])]));
const stack = d3.stack().keys(fams.map(f => f.id)).offset(d3.stackOffsetWiggle).order(d3.stackOrderInsideOut)(rows);
const y = d3.scaleLinear().domain([d3.min(stack, s => d3.min(s, d => d[0])), d3.max(stack, s => d3.max(s, d => d[1]))]).range([H - M.b, M.t]);
const area = d3.area().curve(d3.curveCatmullRom).x((d, i) => x(months[i])).y0(d => y(d[0])).y1(d => y(d[1]));
const svg = d3.select('#stream').attr('width', W).attr('height', H);
svg.append('g').selectAll('path').data(stack).join('path').attr('class', 'layer')
  .attr('d', area).attr('fill', s => color(s.key))
  .on('mousemove', (e, s) => { const f = fams.find(f => f.id == s.key); showTip(e, `<b>${f.name}</b><br>${f.n_topics} topics · ${f.size} docs`); })
  .on('mouseleave', hideTip).on('click', (e, s) => showFamily(fams.find(f => f.id == s.key)));
svg.append('g').attr('class', 'axis').attr('transform', `translate(0,${H - M.b})`).call(d3.axisBottom(x).tickValues(months.filter((m, i) => i % 2 === 0)));
// labels at each stream's widest point
stack.forEach(s => {
  let best = 0, bi = 0; s.forEach((d, i) => { if (d[1] - d[0] > best) { best = d[1] - d[0]; bi = i; } });
  if (y(s[bi][0]) - y(s[bi][1]) > 14) svg.append('text').attr('x', x(months[bi])).attr('y', (y(s[bi][0]) + y(s[bi][1])) / 2)
    .attr('text-anchor', 'middle').attr('dy', '0.35em').attr('font-size', 10).attr('pointer-events', 'none')
    .text(fams.find(f => f.id == s.key).name.split(' · ')[0]);
});
d3.select('#fam-list').selectAll('button').data(fams).join('button')
  .text(f => f.name.split(' · ').slice(0, 2).join(' · ')).style('border-left', f => `4px solid ${color(f.id)}`)
  .on('click', (e, f) => showFamily(f));

// ---- family branching view ----
function showFamily(f) {
  d3.selectAll('#fam-list button').classed('on', b => b.id === f.id);
  d3.select('#fam-title').text(f.name);
  d3.select('#fam-sub').text(`${f.n_topics} micro-topics, ${f.size} documents. Rows in birth order; dashed = branched off its closest earlier relative.`);
  const topics = f.topics, rowH = 26, h = topics.length * rowH + 40;
  const tsvg = d3.select('#tree').attr('width', W).attr('height', h); tsvg.selectAll('*').remove();
  // each row on its own scale: the shape of a topic's life matters, absolute share is in the tooltip
  const yy = (s, t) => (s / (d3.max(t.series) || 1)) * (rowH - 4);
  const rowY = new Map(topics.map((t, i) => [t.id, 20 + i * rowH]));
  tsvg.append('g').attr('class', 'axis').attr('transform', `translate(0,${h - 18})`).call(d3.axisBottom(x).tickValues(months.filter((m, i) => i % 2 === 0)));
  topics.forEach(t => {
    if (t.parent == null || !rowY.has(t.parent)) return;
    const bx = x(months[t.birth]);
    tsvg.append('path').attr('class', 'connector').attr('d', `M${bx},${rowY.get(t.parent) + rowH - 4} L${bx},${rowY.get(t.id) + rowH - 4}`);
  });
  const g = tsvg.append('g').selectAll('g').data(topics).join('g').attr('transform', t => `translate(0,${rowY.get(t.id)})`);
  g.append('path').attr('fill', color(f.id)).attr('opacity', .85)
    .attr('d', t => d3.area().curve(d3.curveMonotoneX).x((s, i) => x(months[i])).y0(rowH - 4).y1(s => rowH - 4 - yy(s, t))
      .defined((s, i) => i >= t.birth)(t.series));
  g.append('text').attr('class', 'row-label').attr('x', M.l).attr('y', rowH - 8)
    .text(t => `${months[t.birth]}  ${t.label}`.slice(0, 40));
  g.append('text').attr('class', 'badge').attr('x', W - M.r).attr('y', rowH - 8).attr('text-anchor', 'end')
    .text(t => t.status === 'rising' ? '▲ rising' : t.status === 'faded' ? '▽ faded' : '◆ peaked');
  g.append('rect').attr('x', 0).attr('width', W).attr('height', rowH).attr('fill', 'transparent')
    .on('mousemove', (e, t) => {
      const parent = topics.find(p => p.id === t.parent);
      showTip(e, `<b>${t.label}</b><br>born ${months[t.birth]} · peak ${months[t.peak]} (${(d3.max(t.series) * 100).toFixed(2)}%) · ${t.status} · drift ${t.drift}` +
        `<br>${t.size} docs · first: ${Object.entries(t.firsts).map(([k, v]) => k + ' ' + v).join(', ')}` +
        `<br>first movers: ${t.movers.map(m => m[0] + ' (' + m[1] + ')').join(', ') || '—'}` +
        (parent ? `<br>branched from: <i>${parent.label}</i>` : '') +
        `<hr>${t.examples.map(x => '• ' + x.replace(/</g, '&lt;')).join('<br>')}`);
    }).on('mouseleave', hideTip);
}
const agent = fams.find(f => /agent/i.test(f.name)) || fams[0];
showFamily(agent);
</script>
</body>
</html>
