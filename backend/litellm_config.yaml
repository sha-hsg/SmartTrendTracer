# Router Settings
router_settings:
  # Automatic Fallback Chains
  fallbacks:
    - tag_suggestion: ["gpt-5.2", "claude-sonnet-4-20250514"]
    - trend_analysis: ["gpt-5.2"]
    - chat_general: ["gpt-5-nano", "claude-sonnet-4-20250514"]
    - rag_answer: ["claude-opus-4-1-20250805", "gpt-5.1"]
    - article_summarizer: ["gpt-5-nano"]
    - entity_extraction_gpt5: ["entity_extraction_gemini", "entity_extraction_fast"]
    - paper_analysis: ["claude-opus-4-1-20250805"]
    - paper_tag_suggestion_deep: ["paper_tag_suggestion_gpt5"]

  # Context Window Fallbacks
  context_window_fallbacks:
    - gemini-2.5-pro: ["claude-opus-4-1-20250805"]
    - claude-opus-4-1-20250805: ["gemini-2.5-pro"]

  # Retry & Timeout Settings
  num_retries: 3
  timeout: 60
  retry_after: 5

  # Caching Configuration
  caching: true
  cache_params:
    type: "in-memory"

  # Load Balancing Strategy
  routing_strategy: "latency-based-routing"

  # Logging
  set_verbose: false

# Success/Failure Callbacks
litellm_settings:
  success_callback: ["custom_mongodb"]
  failure_callback: ["custom_mongodb"]

  callbacks:
    custom_mongodb:
      type: "mongodb"
      connection_string: "mongodb://localhost:27017/"
      database: "smarttrendtracer"
      collection: "llm_usage"
