# Router Settings
router_settings:
  # Automatic Fallback Chains
  fallbacks:
    - tag_suggestion: ["gpt-6-astra", "claude-sonnet-5"]
    - trend_analysis: ["gpt-6-astra"]
    - chat_general: ["gpt-6-luna", "claude-sonnet-5"]
    - rag_answer: ["claude-opus-5-5", "gpt-6-sol"]
    - article_summarizer: ["gpt-6-luna"]
    - entity_extraction_gpt5: ["entity_extraction_gemini", "entity_extraction_fast"]
    - paper_analysis: ["claude-opus-5-5"]
    - paper_tag_suggestion_deep: ["paper_tag_suggestion_gpt5"]
    - tag_reorganization_comprehensive: ["claude-opus-5-5"]

  # Context Window Fallbacks
  context_window_fallbacks:
    - gemini-3.1-pro-preview: ["claude-opus-5-5"]
    - claude-opus-5-5: ["gemini-3.1-pro-preview"]

  # Retry & Timeout Settings
  num_retries: 3
  timeout: 60
  retry_after: 5

  # Caching Configuration
  caching: true
  cache_params:
    type: "in-memory"

  # Load Balancing Strategy
  routing_strategy: "latency-based-routing"

  # Logging
  set_verbose: false

# Success/Failure Callbacks
litellm_settings:
  success_callback: ["custom_mongodb"]
  failure_callback: ["custom_mongodb"]

  callbacks:
    custom_mongodb:
      type: "mongodb"
      connection_string: "os.environ/MONGODB_URL"
      database: "smarttrendtracer"
      collection: "llm_usage"
